#
# Device Configuration API Contract
#
# Documents the device configuration endpoints used by the
# 002-device-config feature. Extends the base akuvox-api.yaml
# contract from spec 001.
---
openapi: "3.0.1"
info:
  title: "Device Configuration API (Client Contract)"
  description: >
    Device configuration get/set endpoints for Akuvox devices.
    Returns all autop-format key-value pairs. Real devices
    return 900+ keys spanning relay, network, SIP, display,
    door settings, and more.
  version: "2.0.0"

paths:
  /api/config/get:
    get:
      summary: "Get full device configuration"
      operationId: getDeviceConfig
      description: >
        Returns all device configuration settings. Response
        data contains autop-format keys with string values
        across all categories (relay, network, SIP, display,
        etc.).
      responses:
        "200":
          description: "Device configuration retrieved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfigResponse"
              example:
                retcode: 0
                action: "get"
                message: "OK"
                data:
                  Config.DoorSetting.RELAY.HoldDelayA: "5"
                  Config.DoorSetting.RELAY.TriggerDelayA: "0"
                  Config.DoorSetting.RELAY.NameA: "Relay1"
                  Config.Network.LAN.IPAddress: "192.168.1.100"
        "401":
          description: "Authentication required"

  /api/config/set:
    post:
      summary: "Set device configuration"
      operationId: setDeviceConfig
      description: >
        Update one or more device configuration settings using
        autop-format keys. All values are strings. Only provided
        keys are updated; omitted keys retain current values.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            examples:
              single_key:
                summary: "Update relay hold delay"
                value: >-
                  {"target": "config", "action": "set",
                  "data": {
                  "Config.DoorSetting.RELAY.HoldDelayA": "8"}}
              multiple_keys:
                summary: "Update multiple settings"
                value: >-
                  {"target": "config", "action": "set",
                  "data": {
                  "Config.DoorSetting.RELAY.HoldDelayA": "8",
                  "Config.DoorSetting.RELAY.NameA": "Front Door"
                  }}
      responses:
        "200":
          description: "Device configuration updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
              example:
                retcode: 0
                action: "config"
                message: "set successfully!"
        "401":
          description: "Authentication required"

components:
  schemas:
    DeviceConfigResponse:
      type: object
      properties:
        retcode:
          type: integer
          description: "0 = success, negative = error"
        action:
          type: string
        message:
          type: string
        data:
          type: object
          description: >
            Key-value pairs using autop-format keys. All values
            are strings. Keys span all device categories.
          additionalProperties:
            type: string

    ActionResponse:
      type: object
      properties:
        retcode:
          type: integer
        action:
          type: string
        message:
          type: string
