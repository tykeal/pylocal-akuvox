name: Feature request
description: Suggest a new capability or enhancement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to pylocal-akuvox.
        Please describe the problem and the outcome you would like.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve, and who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change or capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >-
        Include device models, API endpoints, vendor documentation links, or
        other context if relevant.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
