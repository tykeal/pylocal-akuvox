---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a tag push: builds, tests and promotes the release, then
# publishes to Test PyPI and PyPI.
#
# PyPI publishing runs HERE, not in the reusable workflow. PyPI trusted
# publishing matches the OIDC job_workflow_ref claim against this
# repository, so the publish jobs must live in this caller. The reusable
# `release` job builds, tests, audits, attaches artefacts and promotes the
# draft release; the `test-pypi` and `pypi` jobs below then publish the
# run-scoped build artefact it produced, using the `tag` output it exposes.
name: 'Python Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  # Trigger on tag push events
  push:
    tags:
      - '**'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Harden-runner egress allow-list shared by the publish jobs (matches the
  # default used inside the reusable workflow).
  # yamllint disable-line rule:line-length
  HARDEN_RUNNER_ALLOWLIST: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0

jobs:
  release:
    name: 'Build/Test/Release'
    permissions:
      contents: write       # Create the GitHub release / attach assets
      id-token: write       # OIDC for build provenance attestations
      attestations: write   # Build provenance attestations
    # Pinned to the python-workflows release commit
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test-release.yaml@29e6dfbbf37206cc5334475969ca48d44f117af7  # v0.7.2
    with:
      audit_ignore_vulns: 'GHSA-58qw-9mgm-455v'
      audit_permit_fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}

  test-pypi:
    name: 'Test PyPI Publishing'
    needs: release
    runs-on: 'ubuntu-latest'
    # MUST match the environment on the Test PyPI trusted publisher.
    environment:
      name: development
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Test PyPI publishing'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@b60c42d3d7b32ccf4c851d9e2995530965a6e9cd  # v0.2.4
        with:
          environment: development
          tag: ${{ needs.release.outputs.tag }}
          trusted_publishing: 'true'

  pypi:
    name: 'Release PyPI Package'
    needs:
      - release
      - test-pypi
    runs-on: 'ubuntu-latest'
    # MUST match the environment on the PyPI trusted publisher.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'PyPI release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@b60c42d3d7b32ccf4c851d9e2995530965a6e9cd  # v0.2.4
        with:
          environment: production
          tag: ${{ needs.release.outputs.tag }}
          trusted_publishing: 'true'
          attestations: true
