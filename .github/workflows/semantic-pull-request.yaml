name: '🛠️ Semantic Pull Request'

# yamllint disable-line rule:truthy
on:
  # No workflow_dispatch: the underlying action infers the pull request
  # from the event payload and fails on any other event.
  pull_request:
    # 'edited' catches a title correction, 'synchronize' a push that
    # changes the commit count and therefore whether the single-commit
    # rules apply at all.
    types: [opened, reopened, edited, synchronize]

permissions: {}

# A literal group, NOT '${{ github.workflow }}-${{ github.ref }}'.
# github.workflow resolves to the workflow NAME, so any other workflow
# in the repository carrying this same name would compute the same
# group and one of the two would be cancelled.
concurrency:
  group: 'semantic-pull-request-${{ github.ref }}'
  # Do NOT cancel, and queue rather than replace. This is a required
  # status check: a cancelled run left beside a successful one for the
  # same head SHA blocks ruleset evaluation even though the check
  # passed. The default 'single' queue cancels a pending run when a
  # third event arrives; 'queue: max' holds up to 100 and runs them in
  # order. It cannot be combined with 'cancel-in-progress: true'.
  cancel-in-progress: false
  queue: max

jobs:
  semantic-pull-request:
    name: 'Semantic Pull Request'
    # Delegate to the shared reusable workflow, which tolerates
    # Dependabot's truncated single-commit subjects for long dependency
    # names that otherwise trip validateSingleCommitMatchesPrTitle.
    #
    # The reusable's job is also named 'Semantic Pull Request', so the
    # check run is 'Semantic Pull Request / Semantic Pull Request'.
    # Keep the file name, job id and job name stable: the branch
    # ruleset requires the check by that name.
    #
    # Every input is optional and defaults to the organisation's
    # Conventional Commits policy, which matches this project's: the
    # capitalised types Fix, Feat, Chore, Docs, Style, Refactor, Perf,
    # Test, Revert, CI and Build, with the single commit validated and
    # required to match the title. This caller therefore passes none.
    # See generic-workflows' docs/semantic-pull-request.md.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/generic-workflows/.github/workflows/semantic-pull-request.yaml@7b5720020b61b6aead324badce794089cc2ae208  # v0.8.2
    permissions:
      contents: read  # Read the repository the check runs against.
      pull-requests: read  # Gate step queries the PR API (avoids 403)
