name: 'Autolabeler'

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # SECURITY: pull_request_target is required so that labelling works on
  # pull requests from forks, where the 'pull_request' token is
  # read-only. It is safe here because no job in this workflow checks
  # out any code from the pull request head: the autolabeler reads the
  # PR title and body through the GitHub API only. The 'if:' guard on
  # the job below keeps the privileged trigger to fork pull requests.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ format('al-{0}-pr-{1}', github.event_name, github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  autolabel:
    name: 'Autolabel PR'
    # Run on pull_request_target for forks, pull_request for
    # same-repo PRs to prevent duplicate runs
    # yamllint disable rule:line-length
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork) ||
      (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
    # yamllint enable rule:line-length
    # SECURITY: pull_request_target with write permissions is safe
    # here because the autolabeler action does NOT checkout any code
    # from the PR — it only reads the PR title/body via GitHub API.
    permissions:
      contents: read
      pull-requests: write  # Applies labels to the triggering PR
    runs-on: 'ubuntu-latest'
    timeout-minutes: 3
    steps:
      # Load the organisation egress allow-list for block mode.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # yamllint disable-line rule:line-length
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
