# SPDX-FileCopyrightText: 2026 Andrew Grimberg <tykeal@bardicgrove.org>
# SPDX-License-Identifier: Apache-2.0

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
sort-direction: ascending
categories:
  - title: ":boom: Breaking Change :boom:"
    semver-increment: major
    when:
      label: "breaking-change"
  - title: ":sparkles: New Features :sparkles:"
    semver-increment: minor
    when:
      labels:
        - "enhancement"
        - "feature"
  - title: ":bug: Bug Fixes :bug:"
    semver-increment: patch
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"
  - title: ":zap: Performance :zap:"
    semver-increment: patch
    when:
      label: "performance"
  - title: ":wrench: Maintenance :wrench:"
    semver-increment: patch
    when:
      labels:
        - "chore"
        - "documentation"
        - "maintenance"
        - "repo"
        - "dependencies"
        - "github_actions"
        - "refactor"
        - "style"
        - "build"
        - "revert"
  - title: ":mortar_board: Code Quality :mortar_board:"
    semver-increment: patch
    when:
      labels:
        - "code-quality"
        - "CI"
        - "test"
  # Uncategorized changes retain the existing default patch increment.
  - type: version-resolver
    semver-increment: patch
# Remove autolabeler-managed labels that no longer match, so a PR whose
# title is corrected (e.g. Feat: to Fix:) drops the stale label instead
# of keeping both and skewing the version resolver.
sync-labels: true
autolabeler:
  - label: "breaking-change"
    title:
      - '/^[a-z]+(\([^)]+\))?!:/i'
  - label: "feature"
    title:
      - '/^feat(\([^)]+\))?:/i'
  - label: "bug"
    title:
      - '/^fix(\([^)]+\))?:/i'
  - label: "refactor"
    title:
      - '/^refactor(\([^)]+\))?:/i'
  - label: "code-quality"
    title:
      - '/^test(\([^)]+\))?:/i'
  - label: "CI"
    title:
      - '/^ci(\([^)]+\))?:/i'
  - label: "chore"
    title:
      - '/^chore(\([^)]+\))?:/i'
  - label: "documentation"
    title:
      - '/^docs(\([^)]+\))?:/i'
  - label: "style"
    title:
      - '/^style(\([^)]+\))?:/i'
  - label: "performance"
    title:
      - '/^perf(\([^)]+\))?:/i'
  - label: "revert"
    title:
      - '/^revert(\([^)]+\))?:/i'
  - label: "build"
    title:
      - '/^build(\([^)]+\))?:/i'
# yamllint disable rule:line-length
template: |
  $CHANGES

  ## Links
  - [Submit bugs/feature requests](https://github.com/$OWNER/$REPOSITORY/issues)
